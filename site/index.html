<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pharo Agent Tools Report</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <h1>How agents use the tools</h1>
        <div class="masthead-controls">
          <button type="button" class="toc-button" id="toc-button" aria-controls="toc" aria-expanded="false">Contents</button>
          <label class="facet">
            <span>Calls of</span>
            <select id="facet" aria-label="Which calls the report shows"></select>
          </label>
          <details class="views-menu" id="views">
            <summary>Views</summary>
            <div class="views-panel" id="views-panel"></div>
          </details>
        </div>
      </div>
    </header>
    <div class="layout">
      <nav class="toc" id="toc" aria-label="Contents"></nav>
      <div class="toc-backdrop" id="toc-backdrop"></div>
      <main id="report"></main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
